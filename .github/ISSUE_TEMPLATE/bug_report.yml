name: Bug Report
Description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run `devkit` (or open the DevKit widget)
        2. Select ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevKit Version
      description: What version of DevKit are you running?
      placeholder: e.g., 2.0.0
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: PowerShell Version
      options:
        - PowerShell 7 (pwsh)
        - Windows PowerShell 5.1
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output or error messages
      description: Please copy and paste any relevant output. This will be automatically formatted into code.
      render: shell
