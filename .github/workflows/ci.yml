name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning -ErrorAction SilentlyContinue
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Host "PSScriptAnalyzer found issues."
          } else {
            Write-Host "No issues found."
          }

      - name: Syntax Check all PowerShell files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter "*.ps1"
          $failed = @()
          foreach ($file in $files) {
            $errors = @()
            [void][System.Management.Automation.PSParser]::Tokenize((Get-Content $file.FullName -Raw), [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "SYNTAX ERROR in $($file.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host "  Line $($_.Token.StartLine): $($_.Message)" }
              $failed += $file.FullName
            }
          }
          if ($failed.Count -gt 0) {
            exit 1
          }
          Write-Host "All $($files.Count) PowerShell files passed syntax validation." -ForegroundColor Green

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.0.0

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/Unit"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $config
